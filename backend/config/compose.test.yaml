services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run bootstrap-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bootstrap-dev}
      POSTGRES_DB: navcore_test
    ports:
      - "127.0.0.1:55440:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d navcore_test"]
      interval: 2s
      timeout: 2s
      retries: 15
