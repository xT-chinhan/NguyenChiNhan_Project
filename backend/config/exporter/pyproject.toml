[project]
name = "navigation-model-exporter"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ultralytics==8.4.183", "onnx==1.23.2", "onnxruntime==1.31.0",
  "torch==2.13.0", "torchvision==0.28.0", "numpy==1.26.4",
  "opencv-python==4.11.0.86",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = {index = "pytorch-cpu"}
torchvision = {index = "pytorch-cpu"}
